name: Release

# Tag-pusholásra fut (pl. `git tag v0.1.0 && git push --tags`).
# Mátrix-szal mind a 3 OS-en (Windows, macOS, Linux) build-el, majd egy
# közös `release` job összerakja a draft release-t a GitHub-on.
#
# A DRAFT státusz miatt csak a repo-admin (Áron) látja a fájlokat —
# tesztelőknek manuálisan tovább lehet küldeni, vagy "Publish release"
# kattintással nyilvánossá tenni.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =======================================================================
  #  PER-OS BUILD - mindegyik runner-en a saját bundle-jeit készíti
  # =======================================================================
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Linux-specifikus rendszer-csomagok a Tauri-build-hez (WebKit + GTK).
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            atman/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('atman/src-tauri/Cargo.lock') }}

      - name: Install atman npm deps
        working-directory: atman
        run: npm ci

      # === Atman build - OS-specifikus bundle-targetek ===
      - name: Build atman (Windows)
        if: matrix.platform == 'windows'
        working-directory: atman
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis,updater

      - name: Build atman (macOS universal)
        if: matrix.platform == 'macos'
        working-directory: atman
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg,updater

      # Debug: lássuk hova tette a Tauri a macOS bundle-okat. A `.app`
      # néha a `bundle/macos/` máshol terem (productName-tól és Tauri
      # verziótól függően) - innen tudjuk pontosan a path-t.
      - name: Debug list macOS bundle dir
        if: matrix.platform == 'macos'
        working-directory: atman
        run: |
          echo "=== universal-apple-darwin bundle tree ==="
          find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -print 2>/dev/null || true
          echo "=== generic release bundle (fallback) ==="
          find src-tauri/target/release/bundle -maxdepth 3 -print 2>/dev/null || true

      - name: Build atman (Linux)
        if: matrix.platform == 'linux'
        working-directory: atman
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles deb,rpm,appimage,updater

      # === Portable archív - a runtime/llama-server-t NEM tartalmazza,
      #     azt a scripts/fetch-llama.* tölti le első indításra. ===
      - name: Build portable ZIP (Windows)
        if: matrix.platform == 'windows'
        working-directory: atman
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $stage = "release-staging/LUMI-$version-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/atman.exe" -Destination "$stage/atman.exe"
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "release-staging/LUMI-$version-windows-x64-portable.zip"

      - name: Build portable tar.gz (macOS)
        if: matrix.platform == 'macos'
        working-directory: atman
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="release-staging/LUMI-$version-portable"
          mkdir -p "$stage"
          # A `.app` bundle keresése - lehet a `bundle/macos/`-ban vagy
          # a `bundle/app/`-ben, Tauri verziótól függően. `find`-del
          # mindkettőt lefedjük.
          appPath=$(find src-tauri/target -maxdepth 6 -name "*.app" -type d -print 2>/dev/null | head -1)
          if [ -z "$appPath" ]; then
            echo "::warning::Nem található .app bundle - portable tar.gz kihagyva (a DMG akkor is OK)."
            exit 0
          fi
          echo "Megtalált .app: $appPath"
          cp -R "$appPath" "$stage/"
          (cd release-staging && tar -czf "LUMI-$version-macos-universal-portable.tar.gz" "LUMI-$version-portable")

      - name: Build portable tar.gz (Linux)
        if: matrix.platform == 'linux'
        working-directory: atman
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="release-staging/LUMI-$version-portable"
          mkdir -p "$stage"
          # Az AppImage egyetlen futtatható fájl - ez a Linuxos "portable"
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
          if [ -n "$appimage" ]; then
            cp "$appimage" "$stage/LUMI.AppImage"
            chmod +x "$stage/LUMI.AppImage"
          else
            cp "src-tauri/target/release/atman" "$stage/"
          fi
          (cd release-staging && tar -czf "LUMI-$version-linux-x64-portable.tar.gz" "LUMI-$version-portable")

      # === USB Installer - csak Windows-ra értelmes (drive-detektálás
      #     Win32 API-val); Linux/macOS-en a portable archívot a user
      #     egyszerűen kibontja a céllemezre. ===
      - name: Embed Windows portable ZIP into USB Installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item "atman/release-staging/LUMI-$version-windows-x64-portable.zip" `
            -Destination "lumi-usb-installer/src-tauri/embedded/lumi-portable.zip" -Force

      - name: Install USB Installer npm deps
        if: matrix.platform == 'windows'
        working-directory: lumi-usb-installer
        run: npm install

      - name: Build USB Installer (Windows)
        if: matrix.platform == 'windows'
        working-directory: lumi-usb-installer
        run: npm run tauri build -- --bundles nsis

      # === Artifaktok összegyűjtése ===
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-out
          version="${GITHUB_REF_NAME#v}"

          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp atman/src-tauri/target/release/bundle/nsis/*.exe release-out/ 2>/dev/null || true
            cp atman/src-tauri/target/release/bundle/nsis/*.nsis.zip release-out/ 2>/dev/null || true
            cp atman/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig release-out/ 2>/dev/null || true
            cp atman/release-staging/*.zip release-out/ 2>/dev/null || true
            usb=$(ls lumi-usb-installer/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
            if [ -n "$usb" ]; then
              cp "$usb" "release-out/LUMI-USB-Installer-$version.exe"
            fi
          fi

          if [ "${{ matrix.platform }}" = "macos" ]; then
            # DMG-t keresd `find`-del (lehet a `bundle/dmg/`-ben máshol)
            find atman/src-tauri/target -name "*.dmg" -exec cp {} release-out/ \; 2>/dev/null || true
            # Updater csomag és aláírás
            find atman/src-tauri/target -name "*.app.tar.gz" -exec cp {} release-out/ \; 2>/dev/null || true
            find atman/src-tauri/target -name "*.app.tar.gz.sig" -exec cp {} release-out/ \; 2>/dev/null || true
            # Portable tar.gz (lehet hogy NINCS, az is OK)
            cp atman/release-staging/*.tar.gz release-out/ 2>/dev/null || true
          fi

          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp atman/src-tauri/target/release/bundle/deb/*.deb release-out/ 2>/dev/null || true
            cp atman/src-tauri/target/release/bundle/rpm/*.rpm release-out/ 2>/dev/null || true
            cp atman/src-tauri/target/release/bundle/appimage/*.AppImage release-out/ 2>/dev/null || true
            cp atman/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz release-out/ 2>/dev/null || true
            cp atman/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig release-out/ 2>/dev/null || true
            cp atman/release-staging/*.tar.gz release-out/ 2>/dev/null || true
          fi

          ls -la release-out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumi-${{ matrix.platform }}
          path: release-out/
          if-no-files-found: error

  # =======================================================================
  #  RELEASE - összerakja a draft release-t az összes platform artifaktból
  # =======================================================================
  release:
    name: Create Draft Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + show files
        run: |
          mkdir -p release-final
          find artifacts -type f -exec cp {} release-final/ \;
          ls -la release-final/

      - name: Generate latest.json (multi-platform)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo_url="https://github.com/${{ github.repository }}"
          entries=()

          # Helper: ha létezik egy `*.sig` mintára illő updater csomag a
          # release-final/-ban, hozzáfűz egy platform-bejegyzést az
          # `entries` tömbhöz. `find` kerüli az üres-glob/pipefail
          # csapdát; nem-talált esetben üresen tér vissza, lépő nélkül.
          add_platform() {
            local key=$1 pattern=$2
            local zip sig file_sig
            zip=$(find release-final -maxdepth 1 -name "$pattern" -not -name '*.sig' -print -quit)
            [ -n "$zip" ] || return 0
            sig="${zip}.sig"
            [ -f "$sig" ] || return 0
            file_sig=$(tr -d '\n' < "$sig")
            entries+=("    \"$key\": { \"signature\": \"$file_sig\", \"url\": \"${repo_url}/releases/download/${GITHUB_REF_NAME}/$(basename "$zip")\" }")
          }

          add_platform "windows-x86_64" "*_x64-setup.nsis.zip"
          # macOS universal - mind aarch64, mind x86_64 ugyanazt használja
          add_platform "darwin-aarch64" "*.app.tar.gz"
          add_platform "darwin-x86_64"  "*.app.tar.gz"
          add_platform "linux-x86_64"   "*.AppImage.tar.gz"

          # JSON összerakás - az entries vesszővel összefűzve
          {
            echo "{"
            echo "  \"version\": \"$version\","
            echo "  \"notes\": \"LUMI $version\","
            echo "  \"pub_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"platforms\": {"
            last=$(( ${#entries[@]} - 1 ))
            for i in "${!entries[@]}"; do
              if [ "$i" -lt "$last" ]; then
                echo "${entries[$i]},"
              else
                echo "${entries[$i]}"
              fi
            done
            echo "  }"
            echo "}"
          } > release-final/latest.json

          echo "--- latest.json ---"
          cat release-final/latest.json

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: release-final/*
          generate_release_notes: true
          # DRAFT: csak az admin (Áron) látja a Releases oldalon. A
          # "Publish release" gomb teszi nyilvánossá amikor készen áll.
          # Amíg draft, az auto-update flow NEM jut el a felhasználókhoz.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
