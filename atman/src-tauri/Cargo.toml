[package]
# User-szem-rebbenésre `lumi.exe` lesz a bináris - a crate-név csak ezt
# vezérli. A library-név (atman_lib) belső maradhat - a Rust modul-rendszer
# nem szivárog ki sehova a kifelé látható UX-be.
name = "lumi"
version = "0.2.0"
description = "LUMI — portable private AI by NOMAD"
authors = ["NOMAD"]
edition = "2021"

[lib]
# A library belső azonosítója - a frontend és a main.rs ezt hivatkozza.
# Szándékosan `atman_lib` marad: build- és telepítési pipeline azonosító,
# nem látszik a felhasználónak.
name = "atman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sysinfo = "0.33"
base64 = "0.22"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# macOS/Linux llama.cpp release-ek .tar.gz formátumban érkeznek
tar = "0.4"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_Security"] }
